# Site settings. Restart `bundle exec jekyll serve` after editing this file.

title: Yu Huang
tagline: AI that turns real-world health data into fair, actionable evidence
description: >-
  Yu Huang, Ph.D., is a tenure-track Assistant Professor of Biostatistics and Health
  Data Science at Indiana University School of Medicine, working on fair machine
  learning, disease subphenotyping, health digital twins, and retinal imaging AI.
url: https://yuvisu.github.io
baseurl: ""
locale: en_US
lang: en

author:
  name: Yu Huang
  degree: Ph.D.
  title: Tenure-track Assistant Professor
  department: Biostatistics and Health Data Science
  institution: Indiana University School of Medicine
  location: Indianapolis, Indiana
  email: yh60@iu.edu
  photo: /images/yu-huang.jpg

# Shown as icon links in the header of the home page and in the footer.
links:
  - {label: Google Scholar, icon: scholar, url: "https://scholar.google.com/citations?user=8WgpdfgAAAAJ&hl=en"}
  - {label: ORCID, icon: orcid, url: "https://orcid.org/0000-0001-7373-4716"}
  - {label: GitHub, icon: github, url: "https://github.com/yuvisu"}
  - {label: LinkedIn, icon: linkedin, url: "https://www.linkedin.com/in/yu-huang-b08b72107"}
  - {label: PubMed, icon: pubmed, url: "https://pubmed.ncbi.nlm.nih.gov/?term=yu+huang+indiana+university&sort=date"}
  - {label: ResearchGate, icon: researchgate, url: "https://www.researchgate.net/profile/Yu-Huang-15"}

nav:
  - {title: Research, url: /research/}
  - {title: Publications, url: /publications/}
  - {title: People, url: /people/}
  - {title: CV, url: /cv/}

# Put a public version of the CV here to show a "Download PDF" button on /cv/.
# (The YUCV build includes a phone number and pending grants; leave those out.)
cv_pdf: /files/Yu_Huang_CV.pdf

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: pretty
timezone: America/Indiana/Indianapolis

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - .claude
  - .github
